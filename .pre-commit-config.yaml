# Regenerates requirements.txt from the code's actual imports.
# Installation (once per person cloning the repo):
#     pip install pre-commit
#     pre-commit install
repos:
  - repo: local
    hooks:
      - id: pipreqs
        name: Regenerate requirements.txt (pipreqs)
        entry: python -m pipreqs.pipreqs src --savepath requirements.txt --force
        language: python
        additional_dependencies: [pipreqs]
        pass_filenames: false
        files: \.py$
